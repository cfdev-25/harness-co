# Fly.io app for the definitions service. Deploy from the repository root:
#   fly deploy --config deploy/fly.definitions.toml --dockerfile deploy/definitions.Dockerfile
# Replace `app` with the name you chose at `fly launch`. One machine only: the
# repositories live on the volume mounted at /data, and a git repository
# cannot be served from two machines at once.
app = "harness-co-definitions"
primary_region = "iad"

[build]
  dockerfile = "deploy/definitions.Dockerfile"

[env]
  DEFINITIONS_ROOT = "/data/definitions"
  DEFINITIONS_SOCK = "/data/definitions.sock"
  DEFINITIONS_HOOKS = "/app/engine/definitions/dist/hooks"
  DEFINITIONS_LISTEN = "0.0.0.0:8402"

[mounts]
  source = "definitions_data"
  destination = "/data"
  # Fly takes daily snapshots of the volume (kept five days); the runbook adds
  # a nightly copy to object storage on top.
  snapshot_retention = 5

[http_service]
  internal_port = 8402
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
