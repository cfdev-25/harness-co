# Fly.io app for the API. Deploy from the repository root:
#   fly deploy --config deploy/fly.api.toml --dockerfile deploy/api.Dockerfile
# Replace `app` with the name you chose at `fly launch`.
app = "harness-co-api"
primary_region = "iad"

[build]
  dockerfile = "deploy/api.Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # The CLI heartbeats every 15 s and the console reads on every navigation:
  # the API stays up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
