name: Pi

on:
  pull_request:
    paths:
      - "pi/**"
      - ".github/workflows/pi.yml"
  push:
    branches:
      - main
    paths:
      - "pi/**"
      - ".github/workflows/pi.yml"

permissions:
  contents: read

concurrency:
  group: pi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: pi/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test --workspace=@harness/pi-harness --workspace=@harness/pi-harness-cli
