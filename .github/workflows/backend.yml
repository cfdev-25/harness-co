name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harness_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d harness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/harness_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/harness_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Apply migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file "$migration"
          done
      - run: uv run pytest

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: pi/package-lock.json
      - run: uv sync --project backend --all-groups
      - run: npm ci
        working-directory: pi
      - run: npm run build
        working-directory: pi
      - run: bash scripts/e2e.sh
