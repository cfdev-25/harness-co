name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate repository SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: harness-sbom.spdx.json
      - name: Scan dependencies with OSV
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.3
        with:
          scan-args: |-
            --recursive
            .
